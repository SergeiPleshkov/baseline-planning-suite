name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A newer push to a pull request makes the older run pointless; runs on main all count.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Format, types, lint, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      # The pnpm version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  # The system as users get it: three images behind the shell's gateway, tried from outside.
  stack:
    name: Compose smoke and browser tests
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @baseline/e2e
      - run: pnpm --filter @baseline/e2e exec playwright install --with-deps chromium
      - run: docker compose up --build --detach --wait
      - name: Smoke test
        run: node scripts/smoke.mjs
      - name: Browser tests
        run: pnpm e2e
      # Last, because it stops a service: the shell and the other remote must stay healthy.
      - name: Smoke test with People stopped
        run: |
          docker compose stop people
          node scripts/smoke.mjs --down=people
      - name: Smoke test with Delivery stopped
        run: |
          docker compose start --wait people
          docker compose stop delivery
          node scripts/smoke.mjs --down=delivery
      - name: Container logs
        if: failure()
        run: |
          docker compose ps --all
          docker compose logs --no-color
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          if-no-files-found: ignore
      - name: Tear down
        if: always()
        run: docker compose down --volumes
