# One command: `docker compose up --build`, then open http://localhost:8080.
# Only the shell's gateway is published; the remotes and their APIs are reached through it.
# Each service keeps its data in a named volume, which survives restarts;
# `docker compose down -v` resets it to the seed.
services:
  shell:
    build:
      context: .
      dockerfile: apps/shell/Dockerfile
    ports:
      - '8080:8080'
    environment:
      PEOPLE_REMOTE_ENTRY: ${PEOPLE_REMOTE_ENTRY:-/mf/people/mf-manifest.json}
      DELIVERY_REMOTE_ENTRY: ${DELIVERY_REMOTE_ENTRY:-/mf/delivery/mf-manifest.json}

  people:
    build:
      context: .
      dockerfile: apps/people/Dockerfile
    volumes:
      - people-data:/data

  delivery:
    build:
      context: .
      dockerfile: apps/delivery/Dockerfile
    volumes:
      - delivery-data:/data

volumes:
  people-data:
  delivery-data:
