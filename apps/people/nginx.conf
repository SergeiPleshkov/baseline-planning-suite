# Static bundle: the federated remote and its standalone page. Public files, readable from any origin,
# so a shell pointed at this container from elsewhere can load the manifest and the chunks.
server {
  listen 8080;
  root /usr/share/nginx/html;
  gzip on;
  gzip_types application/javascript application/json text/css;
  add_header Access-Control-Allow-Origin * always;

  location = /mf-manifest.json {
    expires -1;
  }

  location = /index.html {
    expires -1;
  }

  location / {
    try_files $uri $uri/ =404;
  }
}
